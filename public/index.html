<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>created a chat app</title>

</head>

<body>
    <h1>
        hello from chat app !
    </h1>
    <input type="text" id="messageInput" placeholder="type to send messages !">
    <button id="send-btn">
        Send Message
    </button>
    <div id="message-container">

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>

        const socket = io()
        const sendBtn = document.getElementById("send-btn");
        const input = document.getElementById("messageInput");
        const messageContainer = document.getElementById("message-container");


        // socket.onAny((event, ...args) => {
        //     console.log("📩 Got event:", event, "with data:", args);
        // });

        // socket.onAny((event, ...args) => {
        //     if (event === "receiveMessage") {
        //         console.warn("receiveMessage seen in onAny but not firing directly!");
        //     }
        // });

        socket.on("receiveMessage", (message) => {
            console.log("new message from browser: ", message)
            messageContainer.innerHTML = message
        })
        socket.on("connect", () => {
            console.log("Connected to server:", socket.id);
        });
        // document.body
        sendBtn.addEventListener("click", (e) => {
            const message = input.value
            console.log("message sent", message)
            socket.emit("sendMessage", message)
        })

    </script>
</body>

</html>
